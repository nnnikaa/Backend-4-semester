<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Курс валют</title>
    <link rel="stylesheet" href="site.css">
</head>
    <body>
        <div class="conteiner">

            <h1>Нажми на кнопку, чтобы перейти на сайт с курсами валют</h1>
            <button id="btn">Получить курс EUR</button>

            <p id="result">Результат: -</p>

            <script>
                document.getElementById("btn").addEventListener("click", async () => {
                    try {
                        const response = await fetch("https://localhost:7071/api/Currency/rates?code=EUR");

                        if (!response.ok) {
                            document.getElementById("result").innerText =
                                "Ошибка: " + response.status;
                            return;
                        }

                        const data = await response.json();

                        document.getElementById("result").innerText =
                            `Курс ${data.code}: ${data.rate}`;

                    } catch (error) {
                        document.getElementById("result").innerText =
                            "Ошибка запроса (возможно CORS блокировка)";
                        console.error(error);
                    }
                });
            </script>
        </div>
    </body>
</html>
